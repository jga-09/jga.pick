[project]
name = "kalshi-directional-bot"
version = "1.0.0"
description = "Telegram-controlled Kalshi 15-minute directional signal & trading bot (paper by default)"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.0,<23",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["app*"]
