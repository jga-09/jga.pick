services:
  bot:
    build: .
    container_name: kalshi-directional-bot
    restart: unless-stopped
    env_file: .env
    # Explicit DNS: on ChromeOS Linux (Crostini) Docker's default DNS often fails after sleep / Wi-Fi changes
    # ("Temporary failure in name resolution"), which cuts off Telegram, Kalshi and Coinbase.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DATABASE_URL: sqlite:////app/data/bot.db
      # Only needed for authenticated data / live trading. Mount the key read-only:
      # KALSHI_PRIVATE_KEY_PATH: /run/secrets/kalshi.pem
    volumes:
      - bot-data:/app/data
      # - ./secrets/kalshi.pem:/run/secrets/kalshi.pem:ro

volumes:
  bot-data:
